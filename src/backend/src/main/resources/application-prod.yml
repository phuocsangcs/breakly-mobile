# Production profile configuration binding datasource strictly from environment variables.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

# No fallback defaults in production: startup fails fast if secrets are missing.
breakly:
  jwt:
    secret: ${JWT_SECRET}

