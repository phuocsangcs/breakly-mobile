# Base Spring Boot configuration for Breakly backend service.
spring:
  application:
    name: breakly-be
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Application settings. Secrets and API keys are provided only via environment variables.
breakly:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-32b+}
    issuer: ${JWT_ISSUER:breakly}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:30d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jamendo:
    client-id: ${JAMENDO_CLIENT_ID:}
    base-url: ${JAMENDO_BASE_URL:https://api.jamendo.com/v3.0}
    cache-ttl: ${JAMENDO_CACHE_TTL:10m}
  youtube:
    api-key: ${YOUTUBE_API_KEY:}
    base-url: ${YOUTUBE_BASE_URL:https://www.googleapis.com/youtube/v3}
    cache-ttl: ${YOUTUBE_CACHE_TTL:6h}
  news:
    cache-ttl: ${NEWS_CACHE_TTL:5m}
    request-timeout: ${NEWS_REQUEST_TIMEOUT:8s}
    max-items: ${NEWS_MAX_ITEMS:40}
