services:
  postgres:
    image: postgres:16-alpine
    container_name: breakly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: breakly_db
      POSTGRES_USER: breakly
      POSTGRES_PASSWORD: breakly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

