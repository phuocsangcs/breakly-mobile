# GitHub Actions workflow skeleton running frontend TypeScript typechecks, linting, and unit tests.
name: Frontend CI

on:
  push:
    paths:
      - "src/frontend-mobile/**"
      - ".github/workflows/fe-ci.yml"
  pull_request:
    paths:
      - "src/frontend-mobile/**"
      - ".github/workflows/fe-ci.yml"

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend-mobile
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: src/frontend-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck with TypeScript
        run: npx tsc --noEmit

